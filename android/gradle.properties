# Kept modest on purpose: this machine often only has a few GB free
# once the IDE and everything else is running, and a daemon asking for
# more than is actually free gets OOM-killed by Windows outright
# ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true

# The project (D:) and the pub cache (C:) are on different drives, which
# breaks Kotlin incremental compilation on Windows.
kotlin.incremental=false
